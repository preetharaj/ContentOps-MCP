<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContentOps MCP Registry</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f7f7fb; color: #1f2937; }
    header { padding: 32px; background: #111827; color: white; }
    header h1 { margin: 0 0 8px; font-size: 32px; }
    header p { margin: 0; color: #d1d5db; max-width: 900px; }
    main { padding: 28px 32px 48px; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; align-items: center; }
    select, input { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; min-width: 220px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 16px; padding: 18px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05); }
    .card h2 { margin: 0 0 8px; font-size: 20px; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .badge { background: #eef2ff; color: #3730a3; border-radius: 999px; padding: 4px 9px; font-size: 12px; font-weight: 600; }
    .premium { background: #fff7ed; color: #9a3412; }
    .tools { font-size: 13px; line-height: 1.5; color: #4b5563; }
    code { background: #f3f4f6; border-radius: 6px; padding: 2px 5px; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { padding: 24px; background: white; border-radius: 12px; border: 1px dashed #d1d5db; }
  </style>
</head>
<body>
  <header>
    <h1>ContentOps MCP Server Registry</h1>
    <p>Curated, tested, versioned MCP servers for content stacks. Core registry is OSS; premium CRM and marketing add-ons are optional.</p>
  </header>
  <main>
    <div class="toolbar">
      <select id="categoryFilter" aria-label="Filter by category">
        <option value="all">All categories</option>
      </select>
      <input id="searchInput" type="search" placeholder="Search servers or tools" />
      <a href="/static/workflows.html">Workflows</a>
      <a href="/static/runs.html">Runs</a>
    </div>
    <section id="serverGrid" class="grid"></section>
  </main>
  <script>
    let catalog = [];

    async function loadRegistry() {
      const response = await fetch('/registry/servers.json');
      const data = await response.json();
      catalog = data.servers || [];
      const categories = [...new Set(catalog.map(server => server.category))].sort();
      const select = document.getElementById('categoryFilter');
      categories.forEach(category => {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        select.appendChild(option);
      });
      render();
    }

    function render() {
      const category = document.getElementById('categoryFilter').value;
      const term = document.getElementById('searchInput').value.trim().toLowerCase();
      const grid = document.getElementById('serverGrid');
      const filtered = catalog.filter(server => {
        const categoryMatch = category === 'all' || server.category === category;
        const haystack = `${server.name} ${server.id} ${server.tools.join(' ')} ${server.compatibility_notes}`.toLowerCase();
        return categoryMatch && (!term || haystack.includes(term));
      });

      if (!filtered.length) {
        grid.innerHTML = '<div class="empty">No servers match the current filter.</div>';
        return;
      }

      grid.innerHTML = filtered.map(server => `
        <article class="card">
          <h2>${server.name}</h2>
          <div class="meta">
            <span class="badge">${server.category}</span>
            <span class="badge">v${server.version}</span>
            <span class="badge ${server.maintenance_tier === 'premium' ? 'premium' : ''}">${server.maintenance_tier}</span>
            <span class="badge">${server.status}</span>
          </div>
          <p>${server.compatibility_notes}</p>
          <p><strong>Install:</strong> <code>${server.package_hint}</code></p>
          <p><strong>URL:</strong> <a href="${server.url}" target="_blank" rel="noreferrer">docs</a></p>
          <p class="tools"><strong>Tools:</strong> ${server.tools.map(tool => `<code>${tool}</code>`).join(' ')}</p>
        </article>
      `).join('');
    }

    document.getElementById('categoryFilter').addEventListener('change', render);
    document.getElementById('searchInput').addEventListener('input', render);
    loadRegistry().catch(error => {
      document.getElementById('serverGrid').innerHTML = `<div class="empty">Failed to load registry: ${error.message}</div>`;
    });
  </script>
</body>
</html>
